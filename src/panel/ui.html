<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>微信助手 · 控制台</title>
<style>
  :root { --bg:#0f1115; --card:#171a21; --line:#242936; --text:#e7e9ee; --dim:#8b93a7;
          --accent:#4f8cff; --ok:#37c98b; --warn:#f5b74a; --danger:#ff5c5c; }
  * { box-sizing:border-box; }
  body { margin:0; background:var(--bg); color:var(--text);
         font:14px/1.6 -apple-system,"PingFang SC","Helvetica Neue",sans-serif; }
  .wrap { max-width:1320px; margin:0 auto; padding:16px 22px 48px; }
  header { display:flex; align-items:center; justify-content:space-between; gap:16px;
           margin:0 -8px 14px; padding:10px 8px; position:sticky; top:0; z-index:20;
           background:rgba(15,17,21,.92); backdrop-filter:blur(8px); }
  h1 { font-size:19px; margin:0; font-weight:600; letter-spacing:.3px; }
  .sub { color:var(--dim); font-size:12px; margin-top:2px; }
  .grid { display:grid; grid-template-columns:repeat(3, minmax(0, 1fr)); gap:12px; align-items:start; }
  .grid.two { grid-template-columns:repeat(2, minmax(0, 1fr)); }
  @media (max-width:1100px){ .grid { grid-template-columns:repeat(2, minmax(0, 1fr)); } }
  @media (max-width:680px){ .grid, .grid.two { grid-template-columns:1fr; } }
  .card { background:var(--card); border:1px solid var(--line); border-radius:12px; padding:14px 16px 12px; min-width:0; }
  .card h2 { font-size:12.5px; margin:0 0 8px; color:var(--dim); font-weight:500; letter-spacing:.4px; }
  .card input, .card textarea, .card select { max-width:100%; }
  .row { display:flex; align-items:center; justify-content:space-between; gap:10px; margin:6px 0; }
  .k { color:var(--dim); font-size:12.5px; }
  .v { font-variant-numeric:tabular-nums; }
  .dot { width:8px; height:8px; border-radius:50%; display:inline-block; margin-right:7px; }
  .on { background:var(--ok); box-shadow:0 0 8px rgba(55,201,139,.7); }
  .off { background:#5a6072; }
  button { background:#222836; color:var(--text); border:1px solid var(--line); border-radius:8px;
           padding:8px 14px; font-size:13px; cursor:pointer; transition:.15s; font-family:inherit; }
  button:hover { border-color:#38405a; background:#28303f; }
  button.primary { background:var(--accent); border-color:var(--accent); color:#fff; }
  button.primary:hover { filter:brightness(1.1); }
  button.danger { border-color:#4a2a2a; color:var(--danger); }
  button.danger:hover { background:#2a1a1a; }
  button.sel { border-color:var(--accent); color:var(--accent); background:#1b2740; }
  button.big { font-size:15px; padding:11px 22px; border-radius:10px; }
  input[type=text], input[type=number], textarea, select {
    width:100%; background:#11141b; color:var(--text); border:1px solid var(--line);
    border-radius:8px; padding:8px 10px; font:13px/1.5 inherit; outline:none; }
  input:focus, textarea:focus { border-color:var(--accent); }
  textarea { resize:vertical; min-height:70px; }
  .chips { display:flex; gap:8px; flex-wrap:wrap; }
  .hint { color:var(--dim); font-size:12px; margin-top:6px; }
  .log { background:#0b0d12; border:1px solid var(--line); border-radius:8px; padding:10px;
         height:190px; overflow:auto; font:11.5px/1.55 ui-monospace,Menlo,monospace; color:#a9b2c7; white-space:pre-wrap; }
  .chat { display:flex; align-items:center; justify-content:space-between; padding:8px 0; border-bottom:1px solid #1d2230; }
  .chat:last-child { border-bottom:none; }
  .chat small { color:var(--dim); }
  .reply { background:#11141b; border:1px solid var(--line); border-radius:8px; padding:10px;
           margin-top:10px; min-height:52px; white-space:pre-wrap; }
  .toast { position:fixed; right:20px; bottom:20px; background:#202634; border:1px solid var(--line);
           padding:10px 14px; border-radius:9px; font-size:13px; opacity:0; transform:translateY(8px);
           transition:.2s; pointer-events:none; }
  .toast.show { opacity:1; transform:none; }
  .tabs { display:flex; gap:6px; margin-bottom:10px; }
  .tabs button { padding:5px 10px; font-size:12px; }
  .wide { grid-column:1 / -1; }
  .banner { background:#1d2437; border:1px solid #2f3d5e; color:#cfe0ff; border-radius:10px;
            padding:11px 14px; margin-bottom:14px; font-size:13px; display:flex; justify-content:space-between; gap:12px; align-items:center; }
  .banner b { color:#fff; }
  label.f { display:block; color:var(--dim); font-size:12px; margin:10px 0 4px; }
  .ok { color:var(--ok); } .bad { color:var(--danger); }
</style>
</head>
<body>
<div class="wrap">
  <header>
    <div>
      <h1>微信助手 · 控制台</h1>
      <div class="sub" id="subtitle">连接中…</div>
    </div>
    <div style="display:flex; gap:10px; align-items:center">
      <button id="toggle" class="primary big">暂停</button>
      <button id="shutdown" class="danger">停止进程</button>
    </div>
  </header>

  <div class="banner" id="setup" style="display:none">
    <div><b>还没有配置模型 API。</b> 填一个 key 就能开始用——下面「模型 API」里粘贴即可。</div>
    <button class="primary" onclick="document.getElementById('p-key').focus()">去填</button>
  </div>

  <div class="grid">
    <section class="card">
      <h2>状态</h2>
      <div class="row"><span class="k">运行</span><span class="v" id="s-state">—</span></div>
      <div class="row"><span class="k">通道 / 后端</span><span class="v" id="s-route">—</span></div>
      <div class="row"><span class="k">模型</span><span class="v" id="s-model">—</span></div>
      <div class="row"><span class="k">已运行</span><span class="v" id="s-uptime">—</span></div>
      <div class="row"><span class="k">收到 / 回复 / 忽略</span><span class="v" id="s-metrics">—</span></div>
    </section>

    <section class="card">
      <h2>模型 API</h2>
      <label class="f">Base URL（DeepSeek 官方就保持默认；Ollama 填 http://127.0.0.1:11434/v1）</label>
      <input type="text" id="p-base" placeholder="https://api.deepseek.com" />
      <label class="f">模型名</label>
      <input type="text" id="p-model" placeholder="deepseek-chat" />
      <label class="f">API Key（只存在本地 secrets.env，权限 600）</label>
      <input type="password" id="p-key" placeholder="留空则沿用已保存的" />
      <div class="row" style="margin-top:12px">
        <button id="p-save" class="primary">保存并测试</button>
        <span class="hint" id="p-status"></span>
      </div>
    </section>

    <section class="card">
      <h2>接入方式</h2>
      <div class="chips" id="channels"></div>
      <div class="hint" id="ch-desc" style="margin-top:10px"></div>
      <div class="hint" id="ch-live"></div>
      <div class="hint" id="ch-status"></div>
    </section>

    <section class="card">
      <h2>语气</h2>
      <div class="chips" id="tones"></div>
      <div style="margin-top:10px">
        <input type="text" id="tone-extra" placeholder="附加要求，例如：别提加班、别用感叹号" />
      </div>
      <div class="hint">改完立刻生效，下一条回复就用新语气。</div>
    </section>

    <section class="card wide">
      <h2>触发与限流</h2>
      <div class="grid two">
        <div>
          <label class="f" style="display:flex; justify-content:space-between; align-items:center">
            <span>被 @ 才回</span>
            <input type="checkbox" id="c-mentions" style="width:auto" />
          </label>
          <label class="f">关键词（逗号分隔）</label>
          <input type="text" id="c-keywords" placeholder="小深, 机器人" />
          <label class="f">白名单群（这些群的每条消息都接）</label>
          <input type="text" id="c-whitelist" placeholder="产品群, 测试群" />
          <label class="f">白名单接话概率（0–1，1 = 每条都回）</label>
          <input type="number" id="c-prob" min="0" max="1" step="0.05" />
        </div>
        <div>
          <label class="f">同群冷却（秒）</label>
          <input type="number" id="c-cooldown" min="0" step="1" />
          <label class="f">每分钟上限</label>
          <input type="number" id="c-permin" min="1" />
          <label class="f">每小时上限</label>
          <input type="number" id="c-perhour" min="1" />
          <label class="f">每条最多字数</label>
          <input type="number" id="c-chars" min="20" />
          <label class="f">末尾说明</label>
          <input type="text" id="c-disclosure" placeholder="（AI 自动回复）" />
          <div style="margin-top:14px"><button id="save-trigger" class="primary">保存规则</button></div>
        </div>
      </div>
    </section>

    <section class="card">
      <h2>随机发言</h2>
      <div class="row"><span class="k">群里安静时主动说一句</span><label><input type="checkbox" id="pr-enabled" /> 启用</label></div>
      <div class="grid two" style="gap:8px; margin-top:10px">
        <div><label class="f">安静多少分钟后（分钟）</label><input type="number" id="pr-idle" min="5" /></div>
        <div><label class="f">每天最多几句</label><input type="number" id="pr-maxday" min="0" /></div>
        <div><label class="f">最小间隔（分钟）</label><input type="number" id="pr-min" min="1" /></div>
        <div><label class="f">每小时大约几句</label><input type="number" id="pr-perhour" min="1" max="60" /></div>
      </div>
      <div class="row" style="margin-top:10px">
        <button id="pr-save" class="primary">保存</button>
        <button id="pr-now">现在说一句（试）</button>
      </div>
      <div class="hint" id="pr-status">到点后也只按概率开口，不会刷屏。</div>
    </section>

    <section class="card">
      <h2>记忆</h2>
      <div class="row"><span class="k">记住群里的上下文</span><label><input type="checkbox" id="m-enabled" /> 启用</label></div>
      <div class="chips" style="margin-top:10px">
        <button id="m-clear-all" class="danger">清空全部记忆</button>
        <button id="m-refresh">刷新</button>
      </div>
      <div id="chats" style="margin-top:10px"></div>
    </section>

    <section class="card">
      <h2>试聊（不经过微信）</h2>
      <textarea id="test-text" placeholder="问它一句，看语气和长度合不合适"></textarea>
      <div class="row" style="margin-top:8px">
        <button id="test-go" class="primary">发给它</button>
        <span class="hint" id="test-meta"></span>
      </div>
      <div class="reply" id="test-reply">回复会显示在这里</div>
    </section>

    <section class="card">
      <h2>人设 persona.md</h2>
      <textarea id="persona" style="min-height:150px" placeholder="你是谁、怎么说话、边界在哪"></textarea>
      <div class="row" style="margin-top:8px">
        <button id="persona-save" class="primary">保存人设</button>
        <span class="hint" id="persona-meta"></span>
      </div>
    </section>

    <section class="card">
      <h2>日志</h2>
      <div class="tabs">
        <button data-n="40" class="sel">40 行</button>
        <button data-n="120">120 行</button>
        <button data-n="300">300 行</button>
      </div>
      <div class="log" id="log">—</div>
    </section>
  </div>
</div>

<div class="toast" id="toast"></div>

<script>
const TOKEN = new URLSearchParams(location.search).get('t') || '';
const TONES = { neutral:'自然', concise:'简洁', witty:'轻松', warm:'温和', formal:'正式' };
const $ = (id) => document.getElementById(id);
let state = null;
let dirty = false;

async function api(path, opts = {}) {
  const res = await fetch(path, {
    ...opts,
    headers: { 'content-type':'application/json', 'x-panel-token': TOKEN, ...(opts.headers||{}) },
  });
  const data = await res.json().catch(() => ({ error: res.statusText }));
  if (!res.ok) throw new Error(data.error || res.statusText);
  return data;
}

function toast(msg, bad) {
  const el = $('toast');
  el.textContent = msg;
  el.style.borderColor = bad ? 'var(--danger)' : 'var(--line)';
  el.classList.add('show');
  setTimeout(() => el.classList.remove('show'), 2200);
}

function fmtUptime(s) {
  if (s < 60) return s + ' 秒';
  if (s < 3600) return Math.floor(s/60) + ' 分 ' + (s%60) + ' 秒';
  return Math.floor(s/3600) + ' 时 ' + Math.floor((s%3600)/60) + ' 分';
}

function renderState() {
  if (!state) return;
  $('subtitle').textContent = `${state.name} · ${state.channel} 通道 · ${state.backend} 后端`;
  $('s-state').innerHTML = `<span class="dot ${state.paused ? 'off' : 'on'}"></span>${state.paused ? '已暂停' : '在运行'}`;
  $('s-route').textContent = `${state.channel} / ${state.backend}`;
  $('s-model').textContent = state.model;
  $('s-uptime').textContent = fmtUptime(state.uptimeSec);
  const m = state.metrics || {};
  $('s-metrics').textContent = `${m.inbound||0} / ${m.replied||0} / ${m.ignored||0}`;
  $('toggle').textContent = state.paused ? '恢复' : '暂停';
  $('toggle').className = state.paused ? 'primary big' : 'big';

  $('setup').style.display = state.needsKey ? 'flex' : 'none';

  const cs = state.channelStatus;
  $('ch-live').innerHTML = cs
    ? (cs.visible ? '<span class="ok">● 窗口可见，正在监听</span>'
                  : '<span class="bad">● ' + escapeHtml(cs.reason) + '</span>')
    : '';

  if (!dirty) {
    $('tone-extra').value = state.config?.memory ? (state.toneExtra || '') : '';
    $('m-enabled').checked = state.config.memory.enabled !== false;
    const pr = state.config.proactive || {};
    $('pr-enabled').checked = pr.enabled === true;
    $('pr-idle').value = pr.idleMinutes ?? 45;
    $('pr-maxday').value = pr.maxPerDay ?? 6;
    $('pr-min').value = pr.minIntervalMinutes ?? 30;
    $('pr-perhour').value = pr.perHour ?? 10;
    $('c-mentions').checked = state.config.trigger.mentions !== false;
    $('c-keywords').value = (state.config.trigger.keywords || []).join(', ');
    $('c-whitelist').value = (state.config.trigger.whitelistGroups || []).join(', ');
    $('c-prob').value = state.config.trigger.whitelistReplyProbability ?? 0;
    $('c-cooldown').value = Math.round((state.config.limits.perGroupCooldownMs || 0) / 1000);
    $('c-permin').value = state.config.limits.maxRepliesPerMinute ?? 5;
    $('c-perhour').value = state.config.limits.maxRepliesPerHour ?? 60;
    $('c-chars').value = state.config.style.maxCharsPerMessage ?? 160;
    $('c-disclosure').value = state.config.style.disclosure || '';
  }

  document.querySelectorAll('#tones button').forEach((b) => {
    b.classList.toggle('sel', b.dataset.tone === state.tone);
  });
}

async function loadProvider() {
  const p = await api('/api/provider');
  $('p-base').value = p.baseUrl;
  $('p-model').value = p.model;
  $('p-status').innerHTML = p.keyPresent
    ? `<span class="ok">已配置 ${escapeHtml(p.keyMask)}</span>`
    : '<span class="bad">未配置 key</span>';
}

$('p-save').onclick = async () => {
  $('p-status').textContent = '测试中…';
  $('p-save').disabled = true;
  try {
    const r = await api('/api/provider', {
      method: 'POST',
      body: JSON.stringify({ baseUrl: $('p-base').value, model: $('p-model').value, apiKey: $('p-key').value }),
    });
    if (r.ok) {
      $('p-key').value = '';
      $('p-status').innerHTML = `<span class="ok">连通 ✓ ${escapeHtml(r.reply || '')}</span>`;
      toast('模型已接上');
    } else {
      $('p-status').innerHTML = `<span class="bad">失败：${escapeHtml(r.error)}</span>`;
      toast('连接失败：' + r.error, true);
    }
  } catch (e) {
    $('p-status').innerHTML = `<span class="bad">失败：${escapeHtml(e.message)}</span>`;
  } finally {
    $('p-save').disabled = false;
    await refresh();
  }
};

let CHANNEL_INFO = {};
async function loadChannels() {
  const d = await api('/api/channels');
  CHANNEL_INFO = d.channels;
  $('channels').innerHTML = Object.entries(d.channels)
    .map(([k, v]) => `<button data-ch="${k}" class="${k === d.current ? 'sel' : ''}">${v.label}</button>`)
    .join('');
  $('ch-desc').textContent = d.channels[d.current]?.desc || '';
  $('channels').querySelectorAll('[data-ch]').forEach((b) => {
    b.onclick = async () => {
      const type = b.dataset.ch;
      if (type === (state?.channel)) return;
      $('ch-status').textContent = '切换中…';
      $('ch-status').className = 'hint';
      try {
        const r = await api('/api/channel', { method: 'POST', body: JSON.stringify({ type }) });
        if (r.ok) {
          $('ch-status').innerHTML = `<span class="ok">已切到 ${escapeHtml(CHANNEL_INFO[type].label)}</span>`;
          toast('接入方式已切换');
        } else {
          $('ch-status').innerHTML = `<span class="bad">切换失败：${escapeHtml(r.error)}</span>`;
        }
      } catch (e) {
        $('ch-status').innerHTML = `<span class="bad">切换失败：${escapeHtml(e.message)}</span>`;
      }
      await loadChannels(); await refresh();
    };
  });
}

function renderTones() {
  $('tones').innerHTML = Object.entries(TONES)
    .map(([k, v]) => `<button data-tone="${k}">${v}</button>`).join('');
  $('tones').querySelectorAll('button').forEach((b) => {
    b.onclick = async () => {
      await api('/api/config', { method:'POST', body: JSON.stringify({ patch: { 'agent.tone': b.dataset.tone } }) });
      toast('语气已切换为「' + TONES[b.dataset.tone] + '」');
      await refresh();
    };
  });
}

async function refresh() {
  try {
    state = await api('/api/state');
    renderState();
  } catch (e) {
    $('subtitle').textContent = '连不上控制台：' + e.message;
  }
}

async function loadChats() {
  const { chats } = await api('/api/chats');
  $('chats').innerHTML = chats.length
    ? chats.map((c) => `<div class="chat">
        <div><div>${escapeHtml(c.name)}</div><small>${c.messages} 条记忆 · ${c.replies} 次回复</small></div>
        <button class="danger" data-clear="${c.file}">清空</button>
      </div>`).join('')
    : '<div class="hint">还没有任何会话记忆</div>';
  $('chats').querySelectorAll('[data-clear]').forEach((b) => {
    b.onclick = async () => {
      if (!confirm('清空这个群的记忆？')) return;
      await api('/api/chats/' + encodeURIComponent(b.dataset.clear) + '/clear', { method:'POST' });
      toast('已清空'); loadChats(); refresh();
    };
  });
}

async function loadPersona() {
  const p = await api('/api/persona');
  $('persona').value = p.text;
  $('persona-meta').textContent = p.text.length + ' 字';
}

async function loadLogs(n) {
  const { lines } = await api('/api/logs?n=' + n);
  const el = $('log');
  el.textContent = lines.join('\n') || '（今天还没有日志）';
  el.scrollTop = el.scrollHeight;
}

function escapeHtml(s) {
  return String(s).replace(/[&<>"']/g, (c) => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
}

$('toggle').onclick = async () => {
  const path = state?.paused ? '/api/resume' : '/api/pause';
  try { await api(path, { method:'POST' }); toast(state?.paused ? '已恢复' : '已暂停'); await refresh(); }
  catch (e) { toast(e.message, true); }
};

$('shutdown').onclick = async () => {
  if (!confirm('停止整个进程？停完要重新 node src/cli.mjs run。')) return;
  try { await api('/api/shutdown', { method:'POST' }); document.body.innerHTML = '<div style="padding:60px;text-align:center;color:#8b93a7">已停止，可以关掉这个页面了</div>'; }
  catch (e) { toast(e.message, true); }
};

$('save-trigger').onclick = async () => {
  const patch = {
    'behavior.trigger.mentions': $('c-mentions').checked,
    'behavior.trigger.keywords': $('c-keywords').value.split(/[,，]/).map(s => s.trim()).filter(Boolean),
    'behavior.trigger.whitelistGroups': $('c-whitelist').value.split(/[,，]/).map(s => s.trim()).filter(Boolean),
    'behavior.trigger.whitelistReplyProbability': Number($('c-prob').value) || 0,
    'behavior.limits.perGroupCooldownMs': (Number($('c-cooldown').value) || 0) * 1000,
    'behavior.limits.maxRepliesPerMinute': Number($('c-permin').value) || 5,
    'behavior.limits.maxRepliesPerHour': Number($('c-perhour').value) || 60,
    'behavior.style.maxCharsPerMessage': Number($('c-chars').value) || 160,
    'behavior.style.disclosure': $('c-disclosure').value,
  };
  try {
    const r = await api('/api/config', { method:'POST', body: JSON.stringify({ patch }) });
    dirty = false;
    if (r.rejected && r.rejected.length) toast('这些项没保存：' + r.rejected.join(', '), true);
    else toast('规则已保存');
    await refresh();
  } catch (e) { toast(e.message, true); }
};

$('m-enabled').onchange = async () => {
  const on = $('m-enabled').checked;
  await api('/api/config', { method:'POST', body: JSON.stringify({ patch: { 'behavior.memory.enabled': on } }) });
  toast(on ? '记忆已开启' : '记忆已关闭');
  refresh();
};

$('pr-save').onclick = async () => {
  const patch = {
    'behavior.proactive.enabled': $('pr-enabled').checked,
    'behavior.proactive.idleMinutes': Number($('pr-idle').value) || 45,
    'behavior.proactive.maxPerDay': Number($('pr-maxday').value) || 0,
    'behavior.proactive.minIntervalMinutes': Number($('pr-min').value) || 30,
    'behavior.proactive.perHour': Number($('pr-perhour').value) || 1,
  };
  await api('/api/config', { method:'POST', body: JSON.stringify({ patch }) });
  $('pr-status').textContent = $('pr-enabled').checked ? '已开启：安静到设定时长后可能自己开口' : '已关闭';
  dirty = false; toast('随机发言设置已保存'); refresh();
};

$('pr-now').onclick = async () => {
  $('pr-status').textContent = '让它想一句…';
  try {
    const r = await api('/api/proactive/now', { method:'POST', body: '{}' });
    $('pr-status').textContent = r.ok ? `已发到「${r.chat}」：${r.text}` : ('失败：' + r.error);
  } catch (e) {
    $('pr-status').textContent = '失败：' + e.message;
  }
};

$('m-refresh').onclick = () => loadChats();
$('m-clear-all').onclick = async () => {
  if (!confirm('清空所有群的记忆？')) return;
  const { chats } = await api('/api/chats');
  for (const c of chats) await api('/api/chats/' + encodeURIComponent(c.file) + '/clear', { method:'POST' });
  toast('全部清空'); loadChats(); refresh();
};

$('test-go').onclick = async () => {
  const text = $('test-text').value.trim();
  if (!text) return;
  $('test-meta').textContent = '思考中…';
  $('test-reply').textContent = '…';
  try {
    const r = await api('/api/test', { method:'POST', body: JSON.stringify({ text }) });
    $('test-meta').textContent = r.ok ? `${r.backend} · ${r.ms}ms` : `失败 · ${r.ms}ms`;
    $('test-reply').textContent = r.ok ? r.reply : r.error;
  } catch (e) {
    $('test-meta').textContent = '失败';
    $('test-reply').textContent = e.message;
  }
};

$('persona-save').onclick = async () => {
  try {
    const r = await api('/api/persona', { method:'POST', body: JSON.stringify({ text: $('persona').value }) });
    $('persona-meta').textContent = r.chars + ' 字 · 已保存';
    toast('人设已保存');
  } catch (e) { toast(e.message, true); }
};

document.querySelectorAll('.tabs button').forEach((b) => {
  b.onclick = () => {
    document.querySelectorAll('.tabs button').forEach(x => x.classList.remove('sel'));
    b.classList.add('sel');
    loadLogs(Number(b.dataset.n));
  };
});

['tone-extra','c-keywords','c-whitelist','c-prob','c-cooldown','c-permin','c-perhour','c-chars','c-disclosure']
  .forEach((id) => $(id).addEventListener('input', () => { dirty = true; }));

$('tone-extra').addEventListener('change', async (e) => {
  await api('/api/config', { method:'POST', body: JSON.stringify({ patch: { 'agent.toneExtra': e.target.value } }) });
  dirty = false; toast('附加要求已保存'); refresh();
});

renderTones();
refresh();
loadProvider();
loadChannels();
loadPersona();
loadChats();
loadLogs(40);
setInterval(refresh, 3000);
setInterval(() => { if (!document.hidden && !dirty) loadLogs(Number(document.querySelector('.tabs .sel')?.dataset.n || 40)); }, 5000);
setInterval(() => { if (!document.hidden) loadChats(); }, 15000);
</script>
</body>
</html>
